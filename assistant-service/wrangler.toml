name = "leveraged-assistant"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The published site. The knowledge base is read from KB_URL and requests are only accepted from ALLOWED_ORIGIN.
ALLOWED_ORIGIN = "https://trellick-prog.github.io"
KB_URL = "https://trellick-prog.github.io/leveraged-redesign/assistant/kb.json"
SITE_URL = "https://trellick-prog.github.io/leveraged-redesign/"

# Question log storage. Create it with: npx wrangler kv namespace create LOGS
[[kv_namespaces]]
binding = "LOGS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never commit these). Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put REVIEW_TOKEN
